name: Deploy Agent examples

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-yielded-agent-production
  cancel-in-progress: false

env:
  CI: "true"
  VP_GIT_HOOKS: "0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - name: Prepare pinned example sources
        run: vp -C apps/agent run prepare:source
      - name: Deploy examples
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_YIELDED_CLIENT_SECRET: ${{ secrets.AUTH_AGENT_CLIENT_SECRET }}
          BYOK_ENCRYPTION_KEY: ${{ secrets.AGENT_BYOK_ENCRYPTION_KEY }}
          SERVER_OPENAI_KEY: ${{ secrets.AGENT_OPENAI_KEY }}
        run: vp -C apps/agent run deploy
